---
# Variable configuration.
- name: Include variable configuration.
  ansible.builtin.include_tasks: variables.yml

- name: Harden SSH.
  ansible.builtin.import_tasks: ssh.yml

- name: Configure firewall (UFW).
  ansible.builtin.include_tasks: firewall-ufw.yml
  when: network_firewall == 'ufw'

- name: Configure DNS.
  ansible.builtin.import_tasks: dns.yml

- name: Prefer IPv4 for outgoing connections.
  ansible.builtin.import_tasks: ipv4-precedence.yml

- name: Configure hostname.
  ansible.builtin.import_tasks: hostname.yml
