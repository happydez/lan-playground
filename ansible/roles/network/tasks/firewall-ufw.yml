---
- name: Ensure UFW is installed.
  ansible.builtin.package:
    name: ufw
    state: present

- name: Pre-allow SSH ports in UFW (current + target).
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ [ansible_port | default(22), ssh_custom_port] | unique }}"

- name: Reset UFW to completely purge unmanaged rules.
  community.general.ufw:
    state: reset

- name: Set default UFW policies.
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: "{{ ufw_default_incoming_policy }}" }
    - { direction: 'outgoing', policy: "{{ ufw_default_outgoing_policy }}" }

- name: Re-allow SSH ports in UFW after reset.
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ [ansible_port | default(22), ssh_custom_port] | unique }}"

- name: Allow named services.
  community.general.ufw:
    rule: allow
    name: "{{ item }}"
  loop: "{{ ufw_allowed_services }}"
  when: ufw_allowed_services | length > 0

- name: Allow configured custom ports.
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop: "{{ ufw_allowed_ports }}"
  when: ufw_allowed_ports | length > 0

- name: Enable UFW and start on boot.
  community.general.ufw:
    state: enabled

- name: Force all notified handlers to run at this point.
  ansible.builtin.meta: flush_handlers

- name: Update Ansible inventory to use the new SSH port for subsequent tasks.
  ansible.builtin.set_fact:
    ansible_port: "{{ ssh_custom_port }}"
