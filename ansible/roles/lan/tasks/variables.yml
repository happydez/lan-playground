---
- name: Include OS-specific variables.
  ansible.builtin.include_vars: "{{ lookup('first_found', lan__vars_params) }}"
  vars:
    lan__vars_params:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Define lan_ambuild_creates.
  ansible.builtin.set_fact:
    lan_ambuild_creates: "{{ __lan_ambuild_creates }}"
  when: lan_ambuild_creates is not defined
