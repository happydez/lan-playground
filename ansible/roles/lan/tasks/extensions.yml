---
# SteamWorks
- name: Check if SteamWorks installed.
  ansible.builtin.stat:
    path: "{{ sm_extensions_dir }}/SteamWorks.ext.so"
  register: lan_steamworks_check

- name: Install SteamWorks.
  when: not lan_steamworks_check.stat.exists
  block:
    - name: Download SteamWorks.
      ansible.builtin.get_url:
        url: "{{ steamworks_url }}"
        dest: "{{ srcds_work_dir }}/steamworks.tgz"
        timeout: 30
        owner: "{{ lan_user }}"
        group: "{{ lan_user }}"

    - name: Extract SteamWorks into game dir.
      ansible.builtin.unarchive:
        src: "{{ srcds_work_dir }}/steamworks.tgz"
        dest: "{{ srcds_game_dir }}"
        remote_src: true
        owner: "{{ lan_user }}"
        group: "{{ lan_user }}"
        extra_opts:
          - --strip-components=1

    - name: Patch SteamWorks.inc for SM 1.12 syntax.
      ansible.builtin.replace:
        path: "{{ sm_include_dir }}/SteamWorks.inc"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: 'const char sData\[\]', replace: 'const char[] sData' }
        - { regexp: 'const int data\[\]', replace: 'const int[] data' }

# sm-ripext
- name: Check if sm-ripext installed.
  ansible.builtin.stat:
    path: "{{ sm_extensions_dir }}/rip.ext.so"
  register: lan_ripext_check

- name: Install sm-ripext.
  when: not lan_ripext_check.stat.exists
  block:
    - name: Download sm-ripext zip.
      ansible.builtin.get_url:
        url: "{{ smripext_url }}"
        dest: "{{ srcds_work_dir }}/ripext.zip"
        timeout: 30
        owner: "{{ lan_user }}"
        group: "{{ lan_user }}"

    - name: Extract sm-ripext into game dir.
      ansible.builtin.unarchive:
        src: "{{ srcds_work_dir }}/ripext.zip"
        dest: "{{ srcds_game_dir }}"
        remote_src: true
        owner: "{{ lan_user }}"
        group: "{{ lan_user }}"

# srcwrfloppy
- name: Check if srcwrfloppy installed.
  ansible.builtin.stat:
    path: "{{ sm_extensions_dir }}/srcwr💾.ext.so"
  register: lan_srcwrfloppy_check

- name: Install srcwrfloppy.
  when: not lan_srcwrfloppy_check.stat.exists
  block:
    - name: Download srcwrfloppy zip.
      ansible.builtin.get_url:
        url: "{{ srcwrfloppy_url }}"
        dest: "{{ srcds_work_dir }}/srcwrfloppy.zip"
        timeout: 30
        owner: "{{ lan_user }}"
        group: "{{ lan_user }}"

    - name: Extract srcwrfloppy into game dir.
      ansible.builtin.unarchive:
        src: "{{ srcds_work_dir }}/srcwrfloppy.zip"
        dest: "{{ srcds_game_dir }}"
        remote_src: true
        owner: "{{ lan_user }}"
        group: "{{ lan_user }}"
        include:
          - "addons/*"

# clipsparser
- name: Check if clipsparser installed.
  ansible.builtin.stat:
    path: "{{ sm_extensions_dir }}/clipsparser.ext.so"
  register: lan_clipsparser_check

- name: Install clipsparser.
  when: not lan_clipsparser_check.stat.exists
  block:
    - name: Download clipsparser zip.
      ansible.builtin.get_url:
        url: "{{ clipsparser_url }}"
        dest: "{{ srcds_work_dir }}/clipsparser.zip"
        timeout: 30
        owner: "{{ lan_user }}"
        group: "{{ lan_user }}"

    - name: Extract clipsparser into server dir.
      ansible.builtin.unarchive:
        src: "{{ srcds_work_dir }}/clipsparser.zip"
        dest: "{{ srcds_server_dir }}"
