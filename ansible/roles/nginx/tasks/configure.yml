---
- name: Install rate-limit zone config.
  ansible.builtin.template:
    src: ratelimit.conf.j2
    dest: "{{ nginx_conf_d_dir }}/ratelimit.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Install fastdl site config.
  ansible.builtin.template:
    src: fastdl.j2
    dest: "{{ nginx_sites_available_dir }}/fastdl"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Disable default nginx site.
  ansible.builtin.file:
    path: "{{ nginx_sites_enabled_dir }}/default"
    state: absent
  notify: Reload nginx

- name: Enable fastdl site.
  ansible.builtin.file:
    src: "{{ nginx_sites_available_dir }}/fastdl"
    dest: "{{ nginx_sites_enabled_dir }}/fastdl"
    state: link
  notify: Reload nginx

- name: Ensure steam home is traversable by the web server.
  ansible.builtin.file:
    path: "{{ steam_home }}"
    mode: "0755"

- name: Test nginx config.
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure FastDL directories are readable by Nginx.
  ansible.builtin.file:
    path: "{{ steam_home }}/{{ srcds_servers_dir }}/{{ item.name }}/cstrike"
    mode: "u=rwX,g=rX,o=rX"
    recurse: true
  loop: "{{ fastdl_servers }}"
  when: fastdl_servers | length > 0

- name: Enable and start nginx.
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
